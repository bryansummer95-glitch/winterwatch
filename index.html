
<script>
const DEFAULT_MODELS = {
  gemini: "gemini-2.5-flash",
  openai: "gpt-4o-mini",
  anthropic: "claude-3-5-haiku-latest",
  groq: "llama-3.3-70b-versatile"
};

window.onload = () => {
  try {
    const provider = localStorage.getItem("ww_provider");
    const model = localStorage.getItem("ww_model");
    const key = localStorage.getItem("ww_api_key");

    if (provider) document.getElementById("provider").value = provider;
    if (model) document.getElementById("model").value = model;

    if (key) {
      document.getElementById("apiKey").value = key;
      document.getElementById("status").innerText =
        "Key loaded from browser storage.";
    }
  } catch (error) {
    document.getElementById("status").innerText =
      "Storage error: " + error.message;
  }
};

function setDefaultModel() {
  const provider = document.getElementById("provider").value;
  document.getElementById("model").value =
    DEFAULT_MODELS[provider] || "";
}

function saveSettings() {
  const provider = document.getElementById("provider").value;
  const model = document.getElementById("model").value.trim();
  const key = document.getElementById("apiKey").value.trim();
  const status = document.getElementById("status");

  if (!key) {
    status.innerText = "Please enter your API key.";
    return;
  }

  try {
    localStorage.setItem("ww_provider", provider);
    localStorage.setItem("ww_model", model);
    localStorage.setItem("ww_api_key", key);

    status.innerText = "Saved successfully in this browser!";
  } catch (error) {
    status.innerText = "Could not save: " + error.message;
  }
}

function forgetKey() {
  localStorage.removeItem("ww_api_key");
  document.getElementById("apiKey").value = "";
  document.getElementById("status").innerText =
    "API key removed.";
}

async function sendQuestion() {
  const provider = document.getElementById("provider").value;
  const model = document.getElementById("model").value.trim();
  const key = localStorage.getItem("ww_api_key");
  const question = document.getElementById("question").value.trim();

  const answer = document.getElementById("answer");
  const usage = document.getElementById("usage");

  if (!key) {
    answer.innerText = "Please save your API key first.";
    return;
  }

  if (!question) {
    answer.innerText = "Please enter a question.";
    return;
  }

  try {
    answer.innerText = "Connecting to AI...";
    let url, headers = {"Content-Type": "application/json"};
    let body;

    if (provider === "openai" || provider === "groq") {
      url = provider === "openai"
        ? "https://api.openai.com/v1/chat/completions"
        : "https://api.groq.com/openai/v1/chat/completions";

      headers.Authorization = "Bearer " + key;

      body = {
        model,
        messages: [{role: "user", content: question}]
      };

    } else if (provider === "anthropic") {
      url = "https://api.anthropic.com/v1/messages";

      headers["x-api-key"] = key;
      headers["anthropic-version"] = "2023-06-01";
      headers["anthropic-dangerous-direct-browser-access"] = "true";

      body = {
        model,
        max_tokens: 1024,
        messages: [{role: "user", content: question}]
      };

    } else {
      url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;

      headers["x-goog-api-key"] = key;

      body = {
        contents: [{
          role: "user",
          parts: [{text: question}]
        }]
      };
    }

    const response = await fetch(url, {
      method: "POST",
      headers,
      body: JSON.stringify(body)
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error?.message || JSON.stringify(data));
    }

    let result = "";
    let totalTokens = 0;

    if (provider === "openai" || provider === "groq") {
      result = data.choices?.[0]?.message?.content || "";
      totalTokens = data.usage?.total_tokens || 0;

    } else if (provider === "anthropic") {
      result = (data.content || [])
        .map(item => item.text || "")
        .join("\n");

      const u = data.usage || {};
      totalTokens = (u.input_tokens || 0) + (u.output_tokens || 0);

    } else {
      result = (data.candidates?.[0]?.content?.parts || [])
        .map(item => item.text || "")
        .join("\n");

      const u = data.usageMetadata || {};
      totalTokens = (u.promptTokenCount || 0) +
                    (u.candidatesTokenCount || 0);
    }

    answer.innerText = result || "Empty response.";
    usage.innerText = "Total tokens: " + totalTokens;

  } catch (error) {
    answer.innerText = "Error: " + error.message;
    usage.innerText = "Request failed.";
  }
}
</script>
</body>
</html>
