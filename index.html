
<!-- Add PapaParse before your Winter Watch JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<!-- Add this where you want the summary table to appear -->
<section id="five-winters">
  <h2>Five winters, summarised</h2>
  <p id="history-status">Loading historical data...</p>
  <div id="history-table"></div>
</section>

<script>
let fiveWintersSummary = null;

async function loadFiveWinters() {
  const status = document.getElementById("history-status");
  const output = document.getElementById("history-table");

  try {
    // Fetch the CSV once when the page loads
    const response = await fetch("./history.csv");

    if (!response.ok) {
      throw new Error("Could not load history.csv");
    }

    const csvText = await response.text();

    const parsed = Papa.parse(csvText, {
      header: true,
      skipEmptyLines: true,
      dynamicTyping: true
    });

    const data = parsed.data;

    // Check the original dataset before filtering
    const originalRows = data.length;
    const originalRuns = data.filter(
      r => String(r.gritted).toLowerCase() === "yes"
    ).length;

    const originalSalt = data.reduce(
      (sum, r) => sum + (Number(r.salt_t) || 0), 0
    );

    // Remove impossible air temperature readings
    const invalidRows = data.filter(
      r => Number(r.min_air_c) > 40
    );

    const cleanData = data.filter(
      r => Number(r.min_air_c) <= 40
    );

    // Group records by route_id
    const routes = {};

    cleanData.forEach(row => {
      const id = row.route_id;

      if (!routes[id]) {
        routes[id] = {
          route_id: id,
          route: row.route,
          nights: 0,
          runs: 0,
          salt_t: 0,
          ice_incidents: 0,
          ice_treated: 0,
          ice_untreated: 0,
          no_salt_nights: 0
        };
      }

      const r = routes[id];

      r.nights++;

      const ice = Number(row.ice_incidents) || 0;
      const salt = Number(row.salt_t) || 0;
      const gritted = String(row.gritted).toLowerCase();
      const decision = String(row.decision).toLowerCase();

      r.salt_t += salt;
      r.ice_incidents += ice;

      if (gritted === "yes") {
        r.runs++;
        r.ice_treated += ice;
      }

      if (gritted === "no") {
        r.ice_untreated += ice;
      }

      if (decision === "no salt") {
        r.no_salt_nights++;
      }
    });

    const summary = Object.values(routes);

    // Calculate grand totals for the CLEAN summary
    const totals = {
      nights: 0,
      runs: 0,
      salt_t: 0,
      ice_incidents: 0,
      ice_treated: 0,
      ice_untreated: 0,
      no_salt_nights: 0
    };

    summary.forEach(r => {
      Object.keys(totals).forEach(key => {
        totals[key] += r[key];
      });
    });

    fiveWintersSummary = {
      label: "Five winters, summarised",
      source: "history.csv",
      original_rows: originalRows,
      excluded_invalid_temperature_rows: invalidRows.length,
      valid_rows: cleanData.length,
      routes: summary,
      totals: totals
    };

    // Display original-file validation separately
    status.innerHTML = `
      <strong>Original file checks</strong><br>
      Rows: ${originalRows.toLocaleString()}<br>
      Gritting runs: ${originalRuns}<br>
      Salt: ${originalSalt.toFixed(1)} tonnes<br><br>
      <strong>Data quality:</strong>
      ${invalidRows.length} impossible temperature reading excluded.
      <br><strong>Valid records:</strong>
      ${cleanData.length.toLocaleString()}
    `;

    // Build the summary table
    let html = `
      <table border="1" cellpadding="7"
        style="border-collapse:collapse;width:100%;
        text-align:left;">
        <thead>
          <tr>
            <th>Route</th>
            <th>Nights</th>
            <th>Runs</th>
            <th>Salt (t)</th>
            <th>Ice total</th>
            <th>Ice treated</th>
            <th>Ice untreated</th>
            <th>No salt</th>
          </tr>
        </thead>
        <tbody>
    `;

    summary.forEach(r => {
      html += `
        <tr>
          <td>${r.route_id} - ${r.route}</td>
          <td>${r.nights}</td>
          <td>${r.runs}</td>
          <td>${r.salt_t.toFixed(2)}</td>
          <td>${r.ice_incidents}</td>
          <td>${r.ice_treated}</td>
          <td>${r.ice_untreated}</td>
          <td>${r.no_salt_nights}</td>
        </tr>
      `;
    });

    html += `
        </tbody>
        <tfoot>
          <tr>
            <th>GRAND TOTAL</th>
            <th>${totals.nights}</th>
            <th>${totals.runs}</th>
            <th>${totals.salt_t.toFixed(2)}</th>
            <th>${totals.ice_incidents}</th>
            <th>${totals.ice_treated}</th>
            <th>${totals.ice_untreated}</th>
            <th>${totals.no_salt_nights}</th>
          </tr>
        </tfoot>
      </table>
    `;

    output.innerHTML = html;

    console.log("Five winters summary:", fiveWintersSummary);

  } catch (error) {
    status.textContent = "Error: " + error.message;
    console.error(error);
  }
}

// Return ONLY the summary to the AI, never the raw CSV
function getFiveWintersBrainContext() {
  if (!fiveWintersSummary) {
    return "Historical data is not available yet.";
  }

  return "Five winters, summarised:\n" +
    JSON.stringify(fiveWintersSummary);
}

// Load once when the page opens
loadFiveWinters();
</script>
